apiVersion: v1
kind: Namespace
metadata:
  name: semoss-docs
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: semoss-documentation-config
  namespace: semoss-docs
data:
  APP_NAME: "AI EU"
  MONOLITH_API_URL: "http://localhost:8080/ai.eui"
  SUPPORT_EMAIL: "testsupport@deloitte.com"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: semoss-documentation
  namespace: semoss-docs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: semoss-documentation
  template:
    metadata:
      labels:
        app: semoss-documentation
    spec:
      containers:
        - name: documentation
          image: quay.io/semoss/documentation:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: semoss-documentation-config
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: semoss-documentation
  namespace: semoss-docs
spec:
  type: ClusterIP
  selector:
    app: semoss-documentation
  ports:
    - name: http
      port: 3000
      targetPort: 3000
