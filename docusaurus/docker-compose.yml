version: '3.8'
services:
  nginx:
    container_name: semoss-nginx
    image: nginx:latest
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
  frontend:
    container_name: semoss-frontend
    image: semoss-doc:latest
    build:
      context: ..
      dockerfile: docusaurus/Dockerfile
    env_file:
      - .env
    environment:
      - PORT=3000
    expose:
      - "3000"
    depends_on:
      - backend
  backend:
    container_name: semoss-backend
    image: https://quay.io/repository/semoss/semoss:latest
    expose:
      - "8080"
